name: Build and release FrameStride

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build and test on native ARM64 with GCC
        run: |
          test "$(uname -m)" = aarch64
          cmake -S . -B build-frame -G Ninja -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=Release -DFRAMESTRIDE_NATIVE=ON
          cmake --build build-frame --parallel 3
          ctest --test-dir build-frame --output-on-failure
          cmake --install build-frame --prefix build-frame/stage
          driver=build-frame/stage/payload/driver/framestride/bin/linuxarm64/driver_framestride.so
          readelf -d "$driver"
          if readelf -d "$driver" | grep -E 'NEEDED.*(libstdc\+\+|libc\+\+|libgcc_s)|NODELETE'; then
            echo 'Unexpected C++ runtime or loader flag in the SteamVR driver.' >&2
            exit 1
          fi
      - name: Package and check installation
        run: |
          python3 scripts/package.py build-frame/stage dist
          bash tests/install_test.sh dist/framestride-*-linux-aarch64.tar.gz
          (cd dist && sha256sum -c SHA256SUMS)
          cp scripts/install-from-release.sh dist/install-framestride.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: framestride-linux-aarch64
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: framestride-linux-aarch64
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          archive="dist/framestride-${tag#v}-linux-aarch64.tar.gz"
          test -f "$archive"
          assets=("$archive" dist/SHA256SUMS dist/install-framestride.sh)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --latest
          fi
